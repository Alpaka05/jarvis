[project]
name = "jarvis"
version = "0.2.0"
description = "Persönlicher KI-Assistent mit Tool-Use, Sprachein-/ausgabe und Smart-Home-Anbindung (Windows + macOS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "openai>=1.50",
    "google-genai>=1.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "rich>=13.7",
    "beautifulsoup4>=4.12",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "SpeechRecognition>=3.10",
    "spotipy>=2.24",
    "edge-tts>=7.2.8",
    "openwakeword>=0.6.0",
    "miniaudio>=1.71",
    "ddgs>=9.16.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
browser = ["browser-use>=0.5", "playwright>=1.45"]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
