[package]
name = "jarvis-orb"
version = "0.1.0"
description = "Fenster von Jarvis: schwebender Orb und Dashboard"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"

[profile.release]
lto = true
opt-level = "s"
strip = true
