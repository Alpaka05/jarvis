[package]
name = "jarvis-orb"
version = "0.1.0"
description = "Schwebender Orb für Jarvis"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }

[profile.release]
lto = true
opt-level = "s"
strip = true
